[project]
name = "ha-50five"
version = "0.1.0"
description = "50five GraphQL integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "homeassistant",
    "gql[aiohttp]>=3.5.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
test = [
    "pytest-homeassistant-custom-component",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/50five"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
